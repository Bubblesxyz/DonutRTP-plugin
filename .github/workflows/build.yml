name: Build StackFix
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir sf
          unzip -q stackfix-project.zip -d sf
          mvn -B -q -f sf/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: StackFix-jar
          path: sf/target/StackFix.jar

name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip the uploaded zip
        run: |
          mkdir -p build
          for z in ./*.zip; do unzip -o "$z" -d build; done
      - name: Build the plugin
        run: mvn -B -f "$(find build -name pom.xml | head -n 1)" package
      - uses: actions/upload-artifact@v4
        with:
          name: CrafterFix
          path: build/**/target/CrafterFix.jar
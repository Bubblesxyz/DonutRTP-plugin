name: Build special items plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir si
          unzip -q special-items-project.zip -d si
          mvn -B -q -f si/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: SpecialItems-jar
          path: si/target/SpecialItems.jar

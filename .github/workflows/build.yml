name: Build DialogAuth

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Unzip the plugin
        run: unzip -o DialogAuth.zip

      - name: Build with Maven
        run: mvn -B package
        working-directory: DialogAuth

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: DialogAuth
          path: DialogAuth/target/DialogAuth.jar

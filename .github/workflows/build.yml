name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip and build
        run: |
          mkdir -p src_unzipped out
          for z in *.zip; do unzip -o "$z" -d src_unzipped; done
          POM=$(find src_unzipped -name pom.xml | head -n 1)
          cd "$(dirname "$POM")"
          mvn -B package
          cp target/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: SellButton-jar
          path: out/*.jar

name: Build shop plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir shop
          unzip -q server-shop-project.zip -d shop
          mvn -B -q -f shop/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: ServerShop-jar
          path: shop/target/ServerShop.jar

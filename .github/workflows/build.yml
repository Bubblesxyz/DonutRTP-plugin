name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Create Gradle files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'entityhider'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          loader_version=0.18.1
          fabric_version=0.141.4+1.21.11
          mod_version=1.0.0
          maven_group=com.example
          archives_base_name=entityhider
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          repositories {
              maven { url = "https://maven.terraformersmc.com/releases/" }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
              modImplementation "com.terraformersmc:modmenu:17.0.0"
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

      - name: Build
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: entityhider-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

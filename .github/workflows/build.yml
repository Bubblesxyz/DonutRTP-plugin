name: Build orders plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir od
          unzip -q server-orders-project.zip -d od
          mvn -B -q -f od/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: ServerOrders-jar
          path: od/target/ServerOrders.jar
